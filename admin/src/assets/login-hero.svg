<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" fill="none">
  <defs>
    <linearGradient id="panel" x1="80" y1="40" x2="560" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#165dff"/>
      <stop offset="1" stop-color="#0fc6c2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#001529" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- monitor -->
  <g filter="url(#shadow)">
    <rect x="120" y="72" width="400" height="240" rx="24" fill="url(#panel)" stroke="rgba(255,255,255,0.22)" stroke-width="2"/>
    <rect x="148" y="100" width="344" height="184" rx="14" fill="rgba(8,18,40,0.55)" stroke="rgba(255,255,255,0.08)"/>
    <path d="M292 166 L292 218 L348 192 Z" fill="url(#accent)"/>
    <rect x="248" y="312" width="144" height="12" rx="6" fill="rgba(255,255,255,0.18)"/>
    <rect x="288" y="332" width="64" height="8" rx="4" fill="rgba(255,255,255,0.12)"/>
  </g>
  <!-- timeline -->
  <rect x="88" y="318" width="464" height="10" rx="5" fill="rgba(255,255,255,0.08)"/>
  <rect x="88" y="318" width="188" height="10" rx="5" fill="url(#accent)"/>
  <circle cx="276" cy="323" r="10" fill="#fff" stroke="#165dff" stroke-width="3"/>
  <!-- floating cards -->
  <g opacity="0.95">
    <rect x="56" y="128" width="92" height="72" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.16)"/>
    <rect x="72" y="148" width="60" height="8" rx="4" fill="rgba(255,255,255,0.35)"/>
    <rect x="72" y="166" width="44" height="8" rx="4" fill="rgba(255,255,255,0.2)"/>
    <rect x="492" y="96" width="92" height="72" rx="16" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.16)"/>
    <circle cx="538" cy="124" r="14" fill="url(#accent)"/>
    <rect x="512" y="148" width="52" height="8" rx="4" fill="rgba(255,255,255,0.28)"/>
  </g>
  <!-- spark -->
  <circle cx="556" cy="292" r="6" fill="#0fc6c2"/>
  <circle cx="84" cy="84" r="4" fill="#165dff"/>
</svg>
